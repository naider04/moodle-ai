# Render blueprint — deploy this repo on Render as a Web Service.
# Push to GitHub, then: New + Blueprint / or create a Web Service pointing at the repo.
# Docs: https://render.com/docs/blueprint-spec

services:
  - type: web
    name: moodle-viewer
    runtime: node
    plan: free
    buildCommand: npm install --omit=dev
    startCommand: npm start
    healthCheckPath: /api/health
    autoDeploy: true
    envVars:
      - key: SESSION_SECRET
        generateValue: true
      - key: DEFAULT_SITE
        value: https://aulagradoa.unemi.edu.ec
      # Your NVIDIA NIM API key for the AI assistant — set it in the Render dashboard
      - key: NVIDIA_API_KEY
        sync: false
      - key: AI_MODEL
        value: stepfun-ai/step-3.7-flash
      # Optional: seed a personal provider your users can use (any OpenAI-
      # compatible endpoint). Set the base URL + key; customize with
      # AI_PROVIDER_NAME / AI_PROVIDER_MODEL / AI_PROVIDER_DEFAULT=1.
      - key: AI_PROVIDER_BASE_URL
        sync: false
      - key: AI_PROVIDER_API_KEY
        sync: false
      - key: AI_PROVIDER_NAME
        sync: false
      - key: AI_PROVIDER_MODEL
        sync: false
      - key: AI_PROVIDER_DEFAULT
        sync: false
